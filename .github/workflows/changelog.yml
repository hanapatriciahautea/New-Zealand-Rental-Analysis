name: Update Changelog

on:
  push:
    branches: [main]

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepend commits to changelog, grouped by date
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          python3 << 'EOF'
          import subprocess
          import os
          from datetime import date

          before = os.environ['BEFORE_SHA']
          after = os.environ['AFTER_SHA']

          if before == '0000000000000000000000000000000000000000':
              commit_shas = subprocess.check_output(
                  ['git', 'log', '-1', '--pretty=%H']
              ).decode().strip().splitlines()
          else:
              commit_shas = subprocess.check_output(
                  ['git', 'log', f'{before}..{after}', '--pretty=%H']
              ).decode().strip().splitlines()

          today = date.today().isoformat()

          with open('changelog.md') as f:
              lines = f.readlines()
          title = lines[0]
          rest = lines[1:]

          all_new_entries = []
          for sha in reversed(commit_shas):
              if not sha:
                  continue
              author = subprocess.check_output(['git', 'show', '-s', '--pretty=%an', sha]).decode().strip()
              subject = subprocess.check_output(['git', 'show', '-s', '--pretty=%s', sha]).decode().strip()
              body = subprocess.check_output(['git', 'show', '-s', '--pretty=%b', sha]).decode().strip()

              all_new_entries.append(f"- ({author}): {subject}\n")
              if body:
                  all_new_entries.append(f"  {body}\n")

          date_header = f"### {today}\n"

          if rest and rest[0].strip() == date_header.strip():
              new_content = [title, date_header] + all_new_entries + rest[1:]
          else:
              new_content = [title, date_header] + all_new_entries + ["\n"] + rest

          with open('changelog.md', 'w') as f:
              f.writelines(new_content)
          EOF

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add changelog.md
          git commit -m "Update changelog [skip ci]" || echo "No changes to commit"
          git push