name: Update Changelog

on:
  push:
    branches: [main]

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepend commit to changelog, grouped by date
        run: |
          python3 << 'EOF'
          import subprocess
          from datetime import date

          def git_log(fmt):
              return subprocess.check_output(['git', 'log', '-1', f'--pretty={fmt}']).decode().strip()

          today = date.today().isoformat()
          author = git_log('%an')
          subject = git_log('%s')
          body = git_log('%b')

          with open('changelog.md') as f:
              lines = f.readlines()

          title = lines[0]
          rest = lines[1:]

          # Build this commit's entry
          entry_lines = [f"- ({author}): {subject}\n"]
          if body.strip():
              entry_lines.append(f"  {body.strip()}\n")

          date_header = f"### {today}\n"

          if rest and rest[0].strip() == date_header.strip():
              # Today's header already exists - insert entry right after it
              new_content = [title, date_header] + entry_lines + rest[1:]
          else:
              # New date - add a fresh header
              new_content = [title, date_header] + entry_lines + ["\n"] + rest

          with open('changelog.md', 'w') as f:
              f.writelines(new_content)
          EOF

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add changelog.md
          git commit -m "Update changelog [skip ci]" || echo "No changes to commit"
          git push
